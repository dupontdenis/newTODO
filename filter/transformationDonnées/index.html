<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Ma liste de tâches</title>
  <script type="module" src="./todo.mjs"></script>
</head>

<body>

  <div class="container">
    <h1 class="mt-5 mb-4">Ma liste de tâches</h1>

    <form class="mb-3">
      <div class="input-group mb-3">
        <label class="input-group-text" for="task">
          Nouvelle tâche
        </label>
        <input id="task" class="form-control" type="text" autocomplete="off" placeholder="Ajouter une tâche">
      </div>
      <button type="submit" class="btn btn-primary">
        Ajouter
      </button>
    </form>

    <button class="btn btn-primary filter-btn" data-filter="all">
      Toutes
    </button>

    <button class="btn btn-outline-primary filter-btn" data-filter="incomplete">
      Incomplètes
    </button>

    <button class="btn btn-outline-primary filter-btn" data-filter="complete">
      Complètes
    </button>

    <ol id="tasks" class="list-group"></ol>
  </div>

</body>

</html>
