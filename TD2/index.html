<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Ma liste de tâches</title>
  <script type="module" src="./todo.mjs"></script>
</head>

<body>
  <div class="container">
    <h1 class="mt-5 mb-4">Ma liste de tâches</h1>

    <form class="mb-4">
      <div class="mb-3">
        <label for="title" class="form-label">Titre</label>
        <input id="title" class="form-control" type="text" placeholder="Titre de la tâche" required>
      </div>

      <div class="mb-3">
        <label for="content" class="form-label">Contenu</label>
        <textarea id="content" class="form-control" rows="3" placeholder="Description de la tâche" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        Ajouter
      </button>
    </form>

    <h2 class="h4">Liste des tâches</h2>
    <ol id="tasks" class="list-group"></ol>
  </div>
</body>

</html>
